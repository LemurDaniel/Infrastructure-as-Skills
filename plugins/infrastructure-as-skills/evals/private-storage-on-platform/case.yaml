schema_version: "1.1"
name: private-storage-on-platform

# Every check reads infra/infra-spec.yaml unless it says otherwise. Regex over the
# file rather than an llm judge: it checks the whole spec the same way every run.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: iac-authoring

  - name: target-terraform
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'target:\W{0,3}terraform\b'

  - name: exposure-private
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'network_exposure:[\s\S]{0,60}?value:\W{0,3}private\b'

  - name: network-referenced
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'network_ownership:[\s\S]{0,60}?value:\W{0,3}reference\b'

  - name: names-the-hub-vnet
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'vnet-hub-prod-we'

  - name: names-the-platform-workspace
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'log-platform-prod-we'

  - name: records-the-mandate
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'BSI C5'

  - name: storage-public-access-disabled
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'public_network_access:[\s\S]{0,60}?value:\W{0,3}disabled\b'

  # The two referenced things must not reappear as resources this run creates.
  - name: does-not-create-the-vnet
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^\s{2}virtual-network:'
    flags: m
    match: not_contains

  - name: does-not-create-a-workspace
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^\s{2}log-analytics-workspace:'
    flags: m
    match: not_contains

  - name: no-invented-address-space
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '\b10\.\d+\.\d+\.\d+/\d+'
    match: not_contains

  - name: naming-convention-written
    type: file_exists
    path: infra/naming.yaml

  - name: no-code-before-confirmation
    type: file_exists
    path: '**/*.tf'
    exists: false
