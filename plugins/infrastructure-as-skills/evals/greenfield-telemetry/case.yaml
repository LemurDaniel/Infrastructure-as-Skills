schema_version: "1.1"
name: greenfield-telemetry

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: iac-authoring

  - name: target-bicep
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'target:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?bicep\b'

  - name: environment-staging
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'environment:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?staging\b'

  - name: location-gwc
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'location:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?germanywestcentral\b'

  - name: network-created
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'network_ownership:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?create\b'

  - name: workspace-created
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'observability_ownership:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?create\b'

  # The stated ranges are carried exactly - not rounded, not re-planned.
  - name: address-space-as-stated
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '10\.20\.0\.0/16'

  - name: pe-subnet-as-stated
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '10\.20\.1\.0/27'

  - name: app-subnet-as-stated
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'snet-app[\s\S]{0,300}10\.20\.2\.0/24|10\.20\.2\.0/24[\s\S]{0,300}snet-app'

  - name: all-three-resources
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^\s{2}(virtual-network|log-analytics-workspace|storage-account):'
    flags: m
    match: 'count:3'

  - name: retention-90-stated
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'retention_days:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?90\b'

  - name: storage-public-access-disabled
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'public_network_access:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?disabled\b'

  # A created network is a spoke: "nothing exists yet" is the workload, not the
  # platform. DNS zones stay in the hub; the platform's policy writes the records.
  - name: dns-stays-with-platform
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'private_dns_ownership:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?platform\b'

  - name: dns-records-by-policy
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'private_dns_records:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?policy\b'

  - name: corp-landing-zone
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'landing_zone:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?corp\b'

  - name: naming-convention-written
    type: file_exists
    path: infra/naming.yaml

  - name: no-code-before-confirmation
    type: file_exists
    path: '**/*.bicep'
    exists: false
