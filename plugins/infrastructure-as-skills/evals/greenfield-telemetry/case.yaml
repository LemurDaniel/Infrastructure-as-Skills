schema_version: "1.1"
name: greenfield-telemetry

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: iac-authoring

  - name: target-bicep
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'target:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?bicep\b'

  # The stack is the default; the request's "Staging" is one stage of it, beside
  # development, test and production.
  - name: stages-stack-with-staging
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'environments:\s*\[(?=[^\]]*\bdevelopment\b)(?=[^\]]*\btest\b)(?=[^\]]*\bstaging\b)(?=[^\]]*\bproduction\b)[^\]]*\]'

  # The stated range is staging's value, not every stage's: a per-stage map, and the
  # other stages named as open.
  - name: address-space-per-stage
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'address_space:\s*(?:#[^\n]*\s*)*value:\s*(?:#[^\n]*\s*)*(?:\{\s*)?staging:\s*10\.20\.0\.0/16'

  - name: other-stages-open
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'open:[\s\S]*environments:\s*\[[^\]]*\bproduction\b'

  - name: location-gwc
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'location:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?germanywestcentral\b'

  - name: network-created
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'network_ownership:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?create\b'

  - name: workspace-created
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'observability_ownership:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?create\b'

  # The stated ranges are carried exactly - not rounded, not re-planned.
  - name: address-space-as-stated
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '10\.20\.0\.0/16'

  - name: pe-subnet-as-stated
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '10\.20\.1\.0/27'

  - name: app-subnet-as-stated
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'snet-app[\s\S]{0,300}10\.20\.2\.0/24|10\.20\.2\.0/24[\s\S]{0,300}snet-app'

  - name: all-three-resources
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^\s{2}(virtual-network|log-analytics-workspace|storage-account):'
    flags: m
    match: 'count:3'

  - name: retention-90-stated
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'retention_days:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?90\b'

  - name: storage-public-access-disabled
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'public_network_access:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?disabled\b'

  # Nothing in the request names a landing zone platform, so landing_zone takes its
  # default, standalone - and with no platform to own them, the privatelink zones are
  # the deployment's (forced), not referenced from a hub that does not exist.
  - name: standalone-landing-zone
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'landing_zone:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?standalone\b'

  - name: dns-owned-by-deployment
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'private_dns_ownership:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?deployment\b'

  # The requirements were not stated, so the derived storage values carry the default
  # answers - and say which requirement they follow.
  - name: replication-derived-from-outage-impact
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'replication:[\s\S]{0,500}derived_from:\s*deployment\.outage_impact'

  # A Bicep target gets no naming.yaml copy - its name vars are generated from the
  # convention, and the request stated no departure.
  - name: no-naming-copy-for-bicep
    type: file_exists
    path: infra/naming.yaml
    exists: false

  - name: no-code-before-confirmation
    type: file_exists
    path: '**/*.bicep'
    exists: false
