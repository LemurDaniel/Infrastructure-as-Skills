schema_version: "1.1"
name: private-storage-on-platform

# Every check reads infra/infra-spec.yaml unless it says otherwise. Regex over the
# file rather than an llm judge: it checks the whole spec the same way every run.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: infrastructure-as-skills

  - name: target-terraform
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'target:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?terraform\b'

  - name: exposure-private
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'network_exposure:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?private\b'

  - name: network-referenced
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'network_ownership:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?reference\b'

  - name: names-the-hub-vnet
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'vnet-hub-prod-we'

  - name: names-the-platform-workspace
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'log-platform-prod-we'

  - name: records-the-mandate
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'BSI C5'

  - name: storage-public-access-disabled
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'public_network_access:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?disabled\b'

  # The two referenced things must not reappear as resources this run creates.
  - name: does-not-create-the-vnet
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^\s{2}virtual-network:'
    flags: m
    match: not_contains

  - name: does-not-create-a-workspace
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^\s{2}log-analytics-workspace:'
    flags: m
    match: not_contains

  - name: no-invented-address-space
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '\b10\.\d+\.\d+\.\d+/\d+'
    match: not_contains

  # "nur aus dem Firmennetz" over an existing hub is the corp archetype.
  - name: corp-landing-zone
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'landing_zone:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?corp\b'

  - name: dns-records-by-policy
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'private_dns_records:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?policy\b'

  # "Produktion" is the production stage of the default stack; the stated hub and
  # workspace are production's values, the other stages' are open.
  - name: stages-default-stack
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'environments:\s*\[(?=[^\]]*\bdevelopment\b)(?=[^\]]*\btest\b)(?=[^\]]*\bproduction\b)[^\]]*\]'

  - name: hub-is-production-value
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'existing_vnet:[\s\S]{0,120}production:[\s\S]{0,60}vnet-hub-prod-we'

  - name: naming-convention-written
    type: file_exists
    path: infra/naming.yaml

  - name: no-code-before-confirmation
    type: file_exists
    path: '**/*.tf'
    exists: false
