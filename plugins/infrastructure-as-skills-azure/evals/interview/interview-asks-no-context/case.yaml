schema_version: "1.1"
name: interview-asks-no-context

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: infrastructure-as-skills-azure

  # The workload name, subscription, resource group and region are parameterized context:
  # input variables of the template, never a question - the person is still designing.
  - name: no-context-questions
    type: llm
    weight: 3
    focus: last_message
    criteria: |
      The final message is an interview message or a report. FAIL if it asks the user
      for any of: the workload short name, the subscription id, the resource group (or
      whether the resource group exists or should be created), the region, or if it
      lists one of them as still open or without a default. PASS if it asks other things
      or nothing, and it is fine for it to say that these are parameters supplied at
      deploy time. Language and formatting do not matter.
