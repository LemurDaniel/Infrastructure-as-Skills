schema_version: "1.1"
name: diagram-inputs-webshop

# The diagram draws wiring.access, wiring.purposes and wiring.optional and nothing else,
# so these are what the spec has to carry. Every check reads infra/infra-spec.yaml.
# The run cannot draw (no shell in the eval sandbox); the picture is tested by
# core/iac-diagram/tests/run_diagram_tests.py.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: infrastructure-as-skills-azure

  - name: target-terraform
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'target:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?terraform\b'

  - name: exposure-private
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'network_exposure:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?private\b'

  # The three calls the request names, in either YAML shape (inline map or block list).
  - name: access-users-to-app
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'from:\s*\W?users\W?\s*,?\s*(?:#[^\n]*\s*)*to:\s*\W?app-service\b'

  - name: access-app-to-storage
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'from:\s*\W?app-service\W?\s*,?\s*(?:#[^\n]*\s*)*to:\s*\W?storage-account\b'

  - name: access-app-to-vault
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'from:\s*\W?app-service\W?\s*,?\s*(?:#[^\n]*\s*)*to:\s*\W?key-vault\b'

  # Two resources side by side say nothing about who talks to whom: no call starts at the
  # storage account or the vault.
  - name: no-invented-calls
    type: regex
    weight: 3
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'from:\s*\W?(?:storage-account|key-vault)\b'
    match: not_contains

  - name: purpose-product-images
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'purposes:[\s\S]*?(?:Produktbild|product image)'
    flags: i

  - name: exactly-three-resources
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^\s{2}(?:app-service|storage-account|key-vault):'
    flags: m
    match: 'count:3'

  - name: no-code-before-confirmation
    type: file_exists
    path: '**/*.tf'
    exists: false

  - name: no-hand-drawn-diagram
    type: file_exists
    path: '**/*.drawio*'
    exists: false
