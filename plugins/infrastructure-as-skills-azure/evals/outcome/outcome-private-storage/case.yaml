schema_version: "1.1"
name: outcome-private-storage

# The harness cannot read several files in one grader, and real code is spread over many.
# So this case only asserts that code was written; the decisions are scored over the union of
# all infra/**/*.tf by .claude/skills/plugin-evals/scripts/score_outcome.py on the kept
# workspaces, the same for both arms. The prompt never mentions a spec.
graders:
  - name: wrote-terraform
    type: file_exists
    path: "infra/**/*.tf"
