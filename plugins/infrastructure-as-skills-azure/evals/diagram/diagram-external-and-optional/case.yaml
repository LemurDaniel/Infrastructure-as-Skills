schema_version: "1.1"
name: diagram-external-and-optional

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: infrastructure-as-skills-azure

  - name: target-terraform
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'target:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?terraform\b'

  # Outside parties are `external:<name>` actors, the contract spec.md states.
  - name: access-to-graph
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'from:\s*\W?app-service\W?\s*,?\s*(?:#[^\n]*\s*)*to:\s*\W?external:\W?(?:microsoft-?graph|graph|m365|microsoft-?365)'
    flags: i

  - name: access-to-entra
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'to:\s*\W?external:\W?entra|from:\s*\W?external:\W?entra'
    flags: i

  - name: cache-is-optional
    type: regex
    weight: 2
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: '^\s{2}optional:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?(?:#[^\n]*\s*)*[\[\s\-"'']*redis'
    flags: m

  # "Ein Redis Cache für die Sitzungen" can be read as a call from the app, so the call is
  # not graded either way - an earlier version failed a correct spec for recording it.

  - name: exposure-private
    type: regex
    target: { source: file, path: infra/infra-spec.yaml }
    pattern: 'network_exposure:\s*(?:#[^\n]*\s*)*(?:\{\s*)?(?:value:\s*)?\W?private\b'

  - name: no-code-before-confirmation
    type: file_exists
    path: '**/*.tf'
    exists: false

  - name: no-hand-drawn-diagram
    type: file_exists
    path: '**/*.drawio*'
    exists: false
