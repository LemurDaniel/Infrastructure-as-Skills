# Rendered from infra-spec.yaml (deployment.deploy_mechanism: gitlab). See
# plugins/.../core/iac-rendering/references/pipelines.gitlab.md. Not run against a GitLab
# project: written from the documentation, with no scaffold behind it.
#
# Three stage blocks, in order: development -> test -> production.
#
# development and test are `open:` in the spec. Their environments/<stage>.tfvars hold
# placeholders: the plan job of such a stage fails at its first step, and every stage
# behind it waits - so nothing deploys, production included, until they hold real values.
#
# What has to exist before this runs - the platform's, created once, per stage:
#   Identity     one app registration or user-assigned managed identity per stage, with a
#                federated credential: issuer https://gitlab.com (or the instance URL),
#                subject project_path:<group>/<project>:ref_type:branch:ref:master,
#                audience api://AzureADTokenExchange. The subject names the branch, not the
#                stage: the separation between stages is the environment-scoped variables
#                below and the protected environments.
#                Roles: Contributor (or narrower) on the stage's subscription
#                (production: 11111111-2222-3333-4444-555555555555; the others: open) and
#                Storage Blob Data Contributor on the state account.
#   Environment  development, test, production - protected, default branch only; the
#                production deploy job is `when: manual`, so only the users allowed to deploy
#                there can start it (approval rules are a Premium feature).
#   Variables    scoped to each environment: AZURE_CLIENT_ID, AZURE_TENANT_ID,
#                TF_STATE_SUBSCRIPTION_ID, TF_STATE_RESOURCE_GROUP,
#                TF_STATE_STORAGE_ACCOUNT, TF_STATE_CONTAINER
# Rendered from infra-spec.yaml. Platform prerequisites: see pipelines.gitlab.md.
stages:
  - validate
  - development
  - test
  - production

default:
  image:
    name: hashicorp/terraform:1.16        # latest 1.16.x; re-resolve on render
    entrypoint: [""]

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  STATE_KEY_PREFIX: invoicing             # context.workload

validate:
  stage: validate
  script:
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate
    - terraform test

.plan:
  id_tokens:
    AZURE_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      f="environments/$CI_ENVIRONMENT_NAME.tfvars"      # Bicep: main.$CI_ENVIRONMENT_NAME.bicepparam
      [ -f "$f" ] || { echo "$f is missing"; exit 1; }
      if grep -Eq '00000000-0000-0000-0000-000000000000|OPEN-' "$f"; then
        echo "Stage $CI_ENVIRONMENT_NAME still holds placeholder values in $f - answer the open items first."
        exit 1
      fi
    - export ARM_CLIENT_ID="$AZURE_CLIENT_ID" ARM_TENANT_ID="$AZURE_TENANT_ID" ARM_OIDC_TOKEN="$AZURE_OIDC_TOKEN"
    - >
      terraform init
      -backend-config="subscription_id=$TF_STATE_SUBSCRIPTION_ID"
      -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP"
      -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT"
      -backend-config="container_name=$TF_STATE_CONTAINER"
      -backend-config="key=$STATE_KEY_PREFIX/$CI_ENVIRONMENT_NAME.tfstate"
      -backend-config="use_azuread_auth=true"
    - set +e; terraform plan -detailed-exitcode -var-file="environments/$CI_ENVIRONMENT_NAME.tfvars" -out=tfplan; code=$?; set -e
    - if [ "$code" -eq 1 ]; then exit 1; fi
    - echo "$code" > plan.exitcode
    - terraform show -no-color tfplan
  artifacts:
    paths: [tfplan, plan.exitcode]
    expire_in: 1 day                      # a plan file can hold sensitive values in clear

.apply:
  id_tokens:
    AZURE_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual                        # pipeline_approvals; omit this line on an ungated stage
      allow_failure: false                # a manual job blocks the stages behind it
  script:
    - if [ "$(cat plan.exitcode)" != "2" ]; then echo "No changes."; exit 0; fi
    - export ARM_CLIENT_ID="$AZURE_CLIENT_ID" ARM_TENANT_ID="$AZURE_TENANT_ID" ARM_OIDC_TOKEN="$AZURE_OIDC_TOKEN"
    - >
      terraform init
      -backend-config="subscription_id=$TF_STATE_SUBSCRIPTION_ID"
      -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP"
      -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT"
      -backend-config="container_name=$TF_STATE_CONTAINER"
      -backend-config="key=$STATE_KEY_PREFIX/$CI_ENVIRONMENT_NAME.tfstate"
      -backend-config="use_azuread_auth=true"
    - terraform apply tfplan

development:plan:
  extends: .plan
  stage: development
  needs: [validate]
  environment: { name: development, action: prepare }

development:apply:
  extends: .apply
  stage: development
  needs: ["development:plan"]
  environment: { name: development }
  resource_group: development             # one apply per stage at a time, queued
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # ungated: no `when: manual`

test:plan:
  extends: .plan
  stage: test
  needs: ["development:apply"]
  environment: { name: test, action: prepare }

test:apply:
  extends: .apply
  stage: test
  needs: ["test:plan"]
  environment: { name: test }
  resource_group: test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

production:plan:
  extends: .plan
  stage: production
  needs: ["test:apply"]
  environment: { name: production, action: prepare }

production:apply:
  extends: .apply                         # gated: keeps `when: manual` from .apply
  stage: production
  needs: ["production:plan"]
  environment: { name: production }
  resource_group: production
