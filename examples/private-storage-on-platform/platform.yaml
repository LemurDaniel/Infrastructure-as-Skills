# The platform profile the platform team of this example would have written - the facts
# the request stated in prose. With it in the repository, a later run on the same
# platform reads them as source: platform instead of needing them in the request. The
# spec beside it still says `stated`, because the request came first.
schema_version: 1

platform:
  id: corp-platform-prod
  owner: platform team

landing_zone: corp
naming_convention: default
module_telemetry: enabled

network_ownership: reference
existing_vnet:
  name: vnet-hub-prod-we
  resource_group_name: rg-network-prod-we
private_endpoint_subnet: snet-privatelink

private_dns_ownership: platform
private_dns_records: policy

observability_ownership: reference
diagnostics_destination:
  name: log-platform-prod-we
  resource_group_name: rg-observability-prod-we
