# Rendered from infra-spec.yaml (deployment.deploy_mechanism: github). See
# plugins/.../core/iac-rendering/references/pipelines.github.md.
#
# Three stage blocks, in order: development -> test -> production.
#
# development and test are `open:` in the spec (subscription, resource group and platform
# parts unanswered). Their blocks, their tfvars files and the lines below are scaffold with
# placeholders: the plan job of a stage whose file still holds 00000000-... or OPEN-...
# fails at its first step, and every stage behind it waits - so nothing deploys, production
# included, until development and test hold real values. Answering the open items in
# infra-spec.yaml and replacing the placeholders is the whole change.
#
# What has to exist before this runs - the platform's, created once, per stage:
#   Identity    one app registration or user-assigned managed identity per stage
#               (stage_isolation: subscription), with
#                 federated credential, issuer https://token.actions.githubusercontent.com
#                 subject  repo:<owner>/<repo>:environment:<stage>
#                 roles    Contributor (or narrower) on the stage's subscription
#                          (production: 11111111-2222-3333-4444-555555555555;
#                          development, test: open)
#                          Storage Blob Data Contributor on the state account
#   Environment <stage>               deployment branches: master only
#               variables  AZURE_CLIENT_ID, AZURE_TENANT_ID,
#                          TF_STATE_SUBSCRIPTION_ID, TF_STATE_RESOURCE_GROUP,
#                          TF_STATE_STORAGE_ACCOUNT, TF_STATE_CONTAINER
#   Environment production-approval   required reviewers (pipeline_approvals: production)
#               no variables, no secrets
name: Infrastructure

on:
  pull_request:
    paths: ["**.tf", "**.tfvars", ".github/workflows/infra*.yaml"]
  push:
    branches: [master]
    paths: ["**.tf", "**.tfvars", ".github/workflows/infra*.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs on pull requests too: no environment, no id-token, no Azure.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.16.0" # resolved 2026-10-18
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

  development:
    needs: validate
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/infra-stage.yaml
    permissions:
      contents: read
      id-token: write
    with:
      stage: development
      gated: false

  test:
    needs: development
    uses: ./.github/workflows/infra-stage.yaml
    permissions:
      contents: read
      id-token: write
    with:
      stage: test
      gated: false

  production:
    needs: test
    uses: ./.github/workflows/infra-stage.yaml
    permissions:
      contents: read
      id-token: write
    with:
      stage: production
      gated: true # pipeline_approvals: production
