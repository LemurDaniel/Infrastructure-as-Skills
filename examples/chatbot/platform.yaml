# The platform profile the platform team of this example would have written - the facts the
# request stated in prose. With it in the repository, a later run on the same platform reads
# them as source: platform instead of needing them in the request. The spec beside it still
# says `stated`, because the request came first.
schema_version: 1

platform:
  id: corp-platform-prod
  owner: platform team

landing_zone: corp
naming_convention: default
module_telemetry: enabled

# The hub, the peering to it and the privatelink zones are the platform's. This workload
# builds its own spoke network and its own workspace (the request asked for both).
private_dns_ownership: platform
private_dns_records: policy
