# The Bicep render's tests, run by run_arm_tests.py against the compiled ARM of
# bicep/main.bicep (bicepconfig.json beside it turns on symbolic resource names).
# One entry per decision under resources: in ../infra-spec.yaml, named by its key path;
# what the compiled template cannot show is not_testable with its reason.
# check_render_coverage.py checks both. Values the compiler turned into expressions -
# anything referencing another module or a var - are matched by regex on their text.
# A per-stage value is asserted twice: in the template as a parameter reference (no
# literal), and in the stage's parameter file (`stage: staging`) as the stage's value.

# ---------------------------------------------------------------- virtual-network
- decision: virtual-network.addressing.address_space
  stage: staging
  path: parameters.addressSpace.value
  equals: 10.20.0.0/16
- deployment: deployment.address_space
  path: resources.virtualNetwork.properties.parameters.addressPrefixes.value
  equals: ["[parameters('addressSpace')]"]

- decision: virtual-network.addressing.subnets
  stage: staging
  path: parameters.subnets.value
  equals:
    - { name: snet-stg-privatelink-01, addressPrefix: 10.20.1.0/27 }
    - { name: snet-app, addressPrefix: 10.20.2.0/24 }

- decision: virtual-network.addressing.private_endpoint_subnet_prefix
  stage: staging
  path: parameters.subnets.value[0].addressPrefix
  equals: 10.20.1.0/27

- decision: virtual-network.addressing.dns_servers
  path: resources.virtualNetwork.properties.parameters.dnsServers.value
  equals: []

# The subnets compile to a copy over the stage's list; the policy decisions are in its
# expression text, the same for every subnet.
- decision: virtual-network.subnet_policy.private_endpoint_network_policies
  path: resources.virtualNetwork.properties.parameters.subnets
  matches: "'privateEndpointNetworkPolicies', 'Enabled'"

- decision: virtual-network.subnet_policy.service_endpoints
  path: resources.virtualNetwork.properties.parameters.subnets
  matches: "'serviceEndpoints', createArray\\(\\)"

- decision: virtual-network.subnet_policy.subnet_delegations
  path: resources.virtualNetwork.properties.parameters.subnets
  matches: "^(?!.*delegation)"

- decision: virtual-network.security.ddos_protection
  path: resources.virtualNetwork.properties.parameters.ddosProtectionPlanResourceId
  absent: true

- not_testable: virtual-network.security.subnets_expecting_nsg
  reason: recorded in the spec only; the association is rendered where the NSG is, and none is

- decision: virtual-network.observability.diagnostic_workspace
  path: resources.virtualNetwork.properties.parameters.diagnosticSettings.value[0].workspaceResourceId
  matches: "reference\\('workspace'\\)\\.outputs\\.resourceId"

- decision: virtual-network.observability.flow_logs_enabled
  path: resources.virtualNetwork.properties.parameters.flowLogs
  absent: true

# --------------------------------------------------------- log-analytics-workspace
- decision: log-analytics-workspace.cost.retention_days
  stage: staging
  path: parameters.logRetentionDays.value
  equals: 90
- deployment: deployment.log_retention_days
  path: resources.workspace.properties.parameters.dataRetention.value
  equals: "[parameters('logRetentionDays')]"

- decision: log-analytics-workspace.cost.daily_quota_gb
  path: resources.workspace.properties.parameters.dailyQuotaGb.value
  equals: '-1'

- decision: log-analytics-workspace.cost.sku
  path: resources.workspace.properties.parameters.skuName.value
  equals: PerGB2018

- decision: log-analytics-workspace.access.public_network_access
  path: resources.workspace.properties.parameters
  matches: '"publicNetworkAccessForIngestion": \{"value": "Enabled"\}.*"publicNetworkAccessForQuery": \{"value": "Enabled"\}'

- decision: log-analytics-workspace.access.local_auth
  path: resources.workspace.properties.parameters.features.value.disableLocalAuth
  equals: true

- decision: log-analytics-workspace.access.rbac_only_access
  path: resources.workspace.properties.parameters.features.value.enableLogAccessUsingOnlyResourcePermissions
  equals: false

- not_testable: log-analytics-workspace.data_protection.immediate_purge_protection
  reason: the forceDelete query parameter at deletion time, not a template property

- decision: log-analytics-workspace.data_protection.archive_to_storage
  path: resources.workspace.properties.parameters.diagnosticSettings
  absent: true

# ----------------------------------------------------------------- storage-account
- decision: storage-account.networking.public_network_access
  path: resources.storageAccount.properties.parameters.publicNetworkAccess.value
  equals: Disabled

- decision: storage-account.networking.private_endpoint_subnet
  path: resources.storageAccount.properties.parameters.privateEndpoints
  matches: "reference\\('virtualNetwork'\\)\\.outputs\\.subnetResourceIds\\.value\\[0\\]"

- decision: storage-account.networking.private_endpoint_subresources
  path: resources.storageAccount.properties.parameters.privateEndpoints
  matches: "parameters\\('privateEndpointSubresources'\\)"

- decision: storage-account.networking.allow_azure_services_bypass
  path: resources.storageAccount.properties.parameters.networkAcls.value
  equals: { defaultAction: Deny, bypass: AzureServices }

- decision: storage-account.identity.managed_identity
  path: resources.storageAccount.properties.parameters.managedIdentities.value.systemAssigned
  equals: true

- decision: storage-account.identity.role_assignments
  path: resources.storageAccount.properties.parameters.roleAssignments
  matches: "parameters\\('roleAssignments'\\)"

- decision: storage-account.security.shared_access_key_enabled
  path: resources.storageAccount.properties.parameters.allowSharedKeyAccess.value
  equals: false

- decision: storage-account.security.min_tls_version
  path: resources.storageAccount.properties.parameters.minimumTlsVersion.value
  equals: TLS1_2

- decision: storage-account.security.https_traffic_only
  path: resources.storageAccount.properties.parameters.supportsHttpsTrafficOnly.value
  equals: true

- decision: storage-account.security.allow_blob_public_access
  path: resources.storageAccount.properties.parameters.allowBlobPublicAccess.value
  equals: false

- decision: storage-account.security.infrastructure_encryption_enabled
  path: resources.storageAccount.properties.parameters.requireInfrastructureEncryption.value
  equals: true

- decision: storage-account.security.key_management
  path: resources.storageAccount.properties.parameters.customerManagedKey
  absent: true

- decision: storage-account.security.sftp_enabled
  path: resources.storageAccount.properties.parameters.enableSftp.value
  equals: false

- decision: storage-account.data_protection.replication
  stage: staging
  path: parameters.storageSkuName.value
  equals: Standard_LRS
- deployment: deployment.non_production_savings
  path: resources.storageAccount.properties.parameters.skuName.value
  equals: "[parameters('storageSkuName')]"

- decision: storage-account.data_protection.access_tier
  path: resources.storageAccount.properties.parameters.accessTier.value
  equals: Hot

- decision: storage-account.data_protection.blob_soft_delete_days
  path: resources.storageAccount.properties.parameters.blobServices.value.deleteRetentionPolicyDays
  equals: 7

- decision: storage-account.data_protection.container_soft_delete_days
  path: resources.storageAccount.properties.parameters.blobServices.value.containerDeleteRetentionPolicyDays
  equals: 7

- decision: storage-account.data_protection.versioning_enabled
  path: resources.storageAccount.properties.parameters.blobServices.value.isVersioningEnabled
  equals: true

- decision: storage-account.data_protection.change_feed_enabled
  path: resources.storageAccount.properties.parameters.blobServices.value.changeFeedEnabled
  equals: false

- decision: storage-account.data_protection.point_in_time_restore_days
  path: resources.storageAccount.properties.parameters.blobServices.value.restorePolicyEnabled
  absent: true

- decision: storage-account.data_protection.immutability
  path: resources.storageAccount.properties.parameters.immutableStorageWithVersioning
  absent: true

- decision: storage-account.observability.diagnostic_workspace
  path: resources.storageAccount.properties.parameters.diagnosticSettings.value[0].workspaceResourceId
  matches: "reference\\('workspace'\\)\\.outputs\\.resourceId"

- decision: storage-account.observability.diagnostic_categories
  path: resources.storageAccount.properties.parameters.blobServices.value.diagnosticSettings[0].logCategoriesAndGroups
  equals: [{ categoryGroup: audit }]

- decision: storage-account.observability.metrics_enabled
  path: resources.storageAccount.properties.parameters.diagnosticSettings.value[0].metricCategories
  equals: [{ category: AllMetrics }]

# ------------------------------------------------------------- deployment, wiring
- deployment: deployment.private_dns_ownership
  path: resources.privateDnsZone.properties.parameters.virtualNetworkLinks.value[0]
  matches: "reference\\('virtualNetwork'\\).*\"registrationEnabled\": false"

- wiring: wiring.private_dns_zones
  path: resources.storageAccount.properties.parameters.privateEndpoints
  matches: "privateDnsZoneGroupConfigs.*reference\\(format\\('privateDnsZone\\[\\{0\\}\\]'"

- deployment: deployment.module_telemetry
  path: resources.storageAccount.properties.parameters.enableTelemetry.value
  equals: true
