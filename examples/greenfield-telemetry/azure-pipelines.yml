# Rendered from infra-spec.yaml (deployment.deploy_mechanism: azure_devops). See
# plugins/.../core/iac-rendering/references/pipelines.ado.md.
#
# Four stage blocks, in order: development -> test -> staging -> production. The Bicep root
# is bicep/, so every step works in that directory.
#
# development, test and production are `open:` in the spec (address ranges, subscriptions,
# resource groups). Their bicep/main.<stage>.bicepparam files hold OPEN-... placeholders:
# the plan job of such a stage fails at its first step, and every stage behind it waits.
# Nothing deploys until those stages hold real values, staging included, which sits behind
# development and test.
#
# What has to exist before this runs - the platform's, created once, per stage:
#   Service connection  sc-telemetry-<stage>, type "Azure Resource Manager - workload
#                       identity federation", to the stage's subscription
#                       (staging: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee; the others: open)
#   Environment         <stage>; production gets an Approval check (pipeline_approvals:
#                       production) and, on every stage, an Exclusive lock (sequential)
#   Variable group      iac-telemetry-<stage>: AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP
#                       (staging: rg-telemetry-stg-gwc)
# Authorize each of them for this pipeline only.
trigger:
  branches: { include: [master] }
  paths: { include: ["bicep/**", "azure-pipelines.yml", ".azure-pipelines/**"] }
pr:
  branches: { include: [master] }

pool:
  vmImage: ubuntu-latest

stages:
  - stage: validate
    displayName: Validate
    jobs:
      - job: validate
        steps:
          - checkout: self
          - script: az bicep build --file main.bicep --stdout > /dev/null
            displayName: Build
            workingDirectory: bicep
          - script: az bicep lint --file main.bicep
            displayName: Lint
            workingDirectory: bicep
          - script: for f in main.*.bicepparam; do az bicep build-params --file "$f" --stdout > /dev/null; done
            displayName: Parameter files compile against the template
            workingDirectory: bicep

  - template: .azure-pipelines/stage.yml
    parameters:
      stage: development
      dependsOn: validate
      gated: false
      serviceConnection: sc-telemetry-development

  - template: .azure-pipelines/stage.yml
    parameters:
      stage: test
      dependsOn: development
      gated: false
      serviceConnection: sc-telemetry-test

  - template: .azure-pipelines/stage.yml
    parameters:
      stage: staging
      dependsOn: test
      gated: false
      serviceConnection: sc-telemetry-staging

  - template: .azure-pipelines/stage.yml
    parameters:
      stage: production
      dependsOn: staging
      gated: true # pipeline_approvals: production - the check lives on the environment
      serviceConnection: sc-telemetry-production
