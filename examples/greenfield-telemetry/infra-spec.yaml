schema_version: 1

spec:
  id: telemetry-stg
  target: bicep
  generated_by: infrastructure-as-skills
  skill: azure-resources
  skill_version: 0.1.0
  at: 2026-10-18T14:00:00Z

# Values every resource inherits. Resolved once, not per resource.
# All stated in the request - nothing here was guessed.
context:
  environment: staging
  location: germanywestcentral
  workload: telemetry
  subscription_id: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
  resource_group_name: rg-telemetry-stg-gwc
  # Not stated, repository has none, nobody to ask (headless run) - see open:.
  tags: {}

# The deployment set's answers. Resolved once; every resource inherits them.
deployment:
  naming_convention:
    value: default
    source: default
  module_source:
    value: avm
    source: default         # the versions are pinned in the render, never here
  module_telemetry:
    value: enabled
    source: default
  # The requirements group - the request said nothing about outage, loss or access
  # pattern, so each default applies and derives the guardrail value below.
  outage_impact:
    value: disruptive
    source: default
  data_loss_tolerance:
    value: one_week
    source: default
  data_access_pattern:
    value: active
    source: default
  landing_zone:
    value: standalone
    source: default         # "es gibt noch nichts" describes the workload; no platform is
                            # named, so the default holds: the deployment owns network,
                            # DNS zone and workspace. confirm_in production - this is staging
  network_exposure:
    value: private
    source: stated          # "nur privat erreichbar"
  local_auth:
    value: disabled
    source: default
  mandates:
    value: []
    source: default
  key_protection:
    value: software
    source: default
  key_management:
    value: platform_managed
    source: default
  network_ownership:
    value: create
    source: stated          # "ein eigenes VNet"
  address_space:
    value: 10.20.0.0/16
    source: stated
  private_endpoint_subnet_prefix:
    value: 10.20.1.0/27
    source: stated
  private_dns_ownership:
    value: deployment
    source: forced
    forced_by: deployment.landing_zone   # standalone - no platform owns the zones
  observability_ownership:
    value: create
    source: stated          # "ein eigener Log Analytics Workspace"
  log_retention_days:
    value: 90
    source: stated
  daily_quota_gb:
    value: -1
    source: default

# Three resources, no modules/ in the repository, AVM: one root, one module call per
# resource, the wiring in the root.
composition:
  granularity: single
  source: default

resources:
  virtual-network:
    addressing:
      address_space:
        value: 10.20.0.0/16
        source: deployment
      subnets:
        # The private-endpoint subnet's prefix was stated, its name follows the
        # convention; the app subnet was stated with both.
        value:
          - name: snet-stg-privatelink-01
            prefix: 10.20.1.0/27
            purpose: private_endpoints
          - name: snet-app
            prefix: 10.20.2.0/24
        source: stated
      private_endpoint_subnet_prefix:
        value: 10.20.1.0/27
        source: deployment
      dns_servers:
        value: []
        source: default
    subnet_policy:
      private_endpoint_network_policies:
        value: Enabled
        source: default
      service_endpoints:
        value: []
        source: default
      subnet_delegations:
        value: []
        source: default
    security:
      ddos_protection:
        value: false
        source: default
      subnets_expecting_nsg:
        value: []
        source: default
    observability:
      diagnostic_workspace:
        # observability_ownership: create - the destination is the workspace this
        # deployment generates (log-analytics-workspace below).
        value:
          name: log-gwc-stg-telemetry-01
          resource_group_name: rg-telemetry-stg-gwc
        source: deployment
      flow_logs_enabled:
        value: false
        source: default

  log-analytics-workspace:
    cost:
      retention_days:
        value: 90
        source: deployment        # log_retention_days, stated
      daily_quota_gb:
        value: -1
        source: deployment
      sku:
        value: PerGB2018
        source: default
    access:
      public_network_access:
        # network_exposure: private. Consequence to say in the handover: with public
        # query access off, reading the logs needs an Azure Monitor Private Link
        # Scope, which this deployment does not create.
        value: disabled
        source: deployment
      local_auth:
        value: false
        source: deployment        # local_auth: disabled
      rbac_only_access:
        value: true
        source: default
    data_protection:
      immediate_purge_protection:
        value: true
        source: default
      archive_to_storage:
        value: false
        source: default

  storage-account:
    networking:
      public_network_access:
        value: disabled
        source: deployment        # network_exposure: private
      private_endpoint_subnet:
        # network_ownership: create - the subnet generated from
        # private_endpoint_subnet_prefix, not a referenced one.
        value: snet-stg-privatelink-01
        source: deployment
      private_endpoint_subresources:
        value: [blob]
        source: default
      allow_azure_services_bypass:
        value: true
        source: default
    identity:
      managed_identity:
        value: system_assigned
        source: default
      role_assignments:
        # Consumer not named in the request - see open:.
        value: []
        source: default
    security:
      shared_access_key_enabled:
        value: false
        source: deployment        # local_auth: disabled
      min_tls_version:
        value: TLS1_2
        source: default
      https_traffic_only:
        value: true
        source: default
      allow_blob_public_access:
        value: false
        source: default
      infrastructure_encryption_enabled:
        value: true
        source: default
      key_management:
        value: platform_managed
        source: deployment
      sftp_enabled:
        value: false
        source: default
    data_protection:
      replication:
        value: ZRS
        source: requirement
        derived_from: deployment.outage_impact
      access_tier:
        value: Hot
        source: requirement
        derived_from: deployment.data_access_pattern
      blob_soft_delete_days:
        value: 7
        source: requirement
        derived_from: deployment.data_loss_tolerance
      container_soft_delete_days:
        value: 7
        source: requirement
        derived_from: deployment.data_loss_tolerance
      versioning_enabled:
        value: true
        source: requirement
        derived_from: deployment.data_loss_tolerance
      change_feed_enabled:
        value: false
        source: default
      point_in_time_restore_days:
        value: 0
        source: default
      immutability:
        value: none
        source: default
    observability:
      diagnostic_workspace:
        value:
          name: log-gwc-stg-telemetry-01
          resource_group_name: rg-telemetry-stg-gwc
        source: deployment
      diagnostic_categories:
        value: [audit]
        source: default
      metrics_enabled:
        value: true
        source: default

# Decisions that belong to no single resource. With private_dns_ownership: deployment
# the root owns the privatelink zones: one per endpoint sub-resource, linked to the
# created network, and the endpoint's zone group writes the record.
wiring:
  private_dns_zones:
    value: [privatelink.blob.core.windows.net]
    source: forced
    forced_by: deployment.private_dns_ownership
  private_dns_zone_links:
    value:
      - zone: privatelink.blob.core.windows.net
        network: virtual-network
    source: forced
    forced_by: deployment.private_dns_ownership

open:
  - key: context.tags
    question: Which tag set does the organisation apply? Nothing in the request, no repository to read it from.
    owner: workload owner
    blocks: apply
  - key: resources.storage-account.identity.role_assignments
    question: Which principal writes and reads the raw data, and which data-plane role does it need? Shared-key auth is off, so an account with no assignment is working as specified and unusable.
    owner: workload owner
    blocks: apply
